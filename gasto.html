<!doctype html>
<!-- App aparte, solo para registrar gastos. Usa el mismo código que la app completa (app.js) en modo "gasto". -->
<html lang="es-PE" data-app="gasto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gasto rápido</title>
  <meta name="description" content="Registra un gasto de la casa en segundos.">
  <meta name="theme-color" content="#F2F4F8">
  <script>
    // Aplica el modo y el color elegidos antes de pintar, para que no parpadee.
    try {
      document.documentElement.dataset.modo = localStorage.getItem('ff:modo') === 'oscuro' ? 'oscuro' : 'claro';
      document.documentElement.dataset.color = localStorage.getItem('ff:color') || 'marino';
    } catch (e) { document.documentElement.dataset.modo = 'claro'; }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gasto">
  <link rel="manifest" href="gasto.webmanifest">
  <link rel="icon" href="iconos/gasto.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/gasto-192.png">
  <link rel="preload" href="fuentes/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="estilos.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="app.js"></script>
</head>
<body class="solo-gasto">
  <div id="avisos" class="avisos"></div>
  <main id="vista" class="vista" tabindex="-1">

      <svg class="logo-marca vivo" viewBox="96 96 320 320" aria-hidden="true"><defs><linearGradient id="lm-degradado" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="lm-g1"/><stop offset=".5" class="lm-gm"/><stop offset="1" class="lm-g2"/></linearGradient><radialGradient id="lm-luz" cx=".3" cy=".2" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".65" stop-color="#fff" stop-opacity="0"/></radialGradient><linearGradient id="lm-rayo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="lm-recorte"><path d="M256 118 396 232v136a24 24 0 0 1-24 24H140a24 24 0 0 1-24-24V232z" stroke-width="30" stroke-linejoin="round"/></clipPath></defs><g class="lm-casa"><path class="lm-base" d="M256 118 396 232v136a24 24 0 0 1-24 24H140a24 24 0 0 1-24-24V232z"/><path class="lm-luz" d="M256 118 396 232v136a24 24 0 0 1-24 24H140a24 24 0 0 1-24-24V232z"/><g clip-path="url(#lm-recorte)"><g transform="rotate(24 256 256)"><rect class="lm-brillo" x="-40" y="-160" width="120" height="840"/></g></g><rect class="lm-b lm-b1" x="160" y="312" width="50" height="74" rx="14"/><rect class="lm-b lm-b2" x="231" y="268" width="50" height="118" rx="14"/><rect class="lm-b lm-b3" x="302" y="224" width="50" height="162" rx="14"/></g></svg>
