<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FinFamily</title>
  <meta name="description" content="Gastos, tarjetas y presupuesto de la familia.">
  <meta name="theme-color" content="#F2F4F8">
  <script>
    // Aplica el modo y el color elegidos antes de pintar, para que no parpadee.
    try {
      document.documentElement.dataset.modo = localStorage.getItem('ff:modo') === 'oscuro' ? 'oscuro' : 'claro';
      document.documentElement.dataset.color = localStorage.getItem('ff:color') || 'marino';
    } catch (e) { document.documentElement.dataset.modo = 'claro'; }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FinFamily">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="preload" href="fuentes/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="estilos.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="avisos" class="avisos"></div>
  <main id="vista" class="vista" tabindex="-1">
    <div class="pantalla arranque" aria-busy="true" aria-label="Abriendo FinFamily">
      <svg class="logo-marca vivo" viewBox="0 0 512 512" aria-hidden="true">
        <defs><linearGradient id="lm-degradado" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="lm-g1"/><stop offset="1" class="lm-g2"/></linearGradient></defs>
        <rect class="lm-fondo" width="512" height="512" rx="116"/>
        <path class="lm-techo" d="M116 238 256 126l140 112" pathLength="100"/>
        <rect class="lm-b lm-b1" x="160" y="312" width="46" height="76" rx="14"/>
        <rect class="lm-b lm-b2" x="233" y="274" width="46" height="114" rx="14"/>
        <rect class="lm-b lm-b3" x="306" y="240" width="46" height="148" rx="14"/>
      </svg>
      <i class="arranque-barra" aria-hidden="true"><b></b></i>
    </div>
  </main>
  <nav id="nav" class="barra-nav" aria-label="Secciones"></nav>
  <noscript><p class="pantalla">FinFamily necesita JavaScript activado.</p></noscript>
</body>
</html>
